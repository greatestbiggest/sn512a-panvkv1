          sh ./scripts/validate-binary.sh --abi android "$LIB"
          python3 "$ROOT/scripts/package_liberty_driver.py" "$LIB" "$WORK/Liberty-SN512A-PanVK-v12-VERTEX32-LEGACY-GRALLOC-UNVERIFIED.zip"
          printf 'Built experimental ZIP at %s\n' "$WORK/Liberty-SN512A-PanVK-v12-VERTEX32-LEGACY-GRALLOC-UNVERIFIED.zip"
          SN512A_SOURCE_EOF
          cat > 'sn512a-src/patches/patch_vertex32.py' <<'SN512A_V11_VERTEX32_EOF'
          #!/usr/bin/env python3
          """Lift PanVK's per-device software vertex input limit 16 -> 32.
          
          Only edits Mesa's PanVK MAX_VBS capacity constants. Both the advertised
          VkPhysicalDeviceLimits values and the driver vertex buffer arrays reference
          MAX_VBS. Does not change gralloc/swapchain code or claim 64-slot support.
          
          Run after the upstream pinned Mesa patch stack is prepared, before Meson.
          Fail closed if the physical-device contract or capacity definitions drift.
          """
          from __future__ import annotations
          import argparse
          import re
          from pathlib import Path
          
          MAX_VBS_DEFINE = re.compile(r"^(?P<indent>[ \t]*)#\s*define\s+MAX_VBS\s+(?P<count>\d+)(?P<trail>\s*(?://[^\n]*|/\*[^\n]*\*/\s*)?)$", re.M)
          
          
          def patch_text(text: str) -> tuple[str, int]:
              """Change only #define MAX_VBS 16 to 32, or accept idempotent 32."""
              matches = list(MAX_VBS_DEFINE.finditer(text))
              if not matches:
                  return text, 0
              if len(matches) != 1:
                  raise ValueError(f"Expected at most one MAX_VBS definition, saw {len(matches)}")
              m = matches[0]
              previous = int(m.group('count'))
              if previous not in (16, 32):
                  raise ValueError(f"Unexpected upstream MAX_VBS={previous}; requires audit")
              changed = MAX_VBS_DEFINE.sub(
                  lambda match: f"{match.group('indent')}#define MAX_VBS 32{match.group('trail')}",
                  text,
                  count=1,
              )
              return changed, 1
          
          
          def patch_mesa(root: Path) -> list[Path]:
              path = root / 'src/panfrost/vulkan'
              if not path.is_dir():
                  raise FileNotFoundError(path)
              # Physical device should read the capacity from MAX_VBS, not a fixed 16.
              dev = path / 'panvk_vX_physical_device.c'
              dev_src = dev.read_text()
              for name in ('maxVertexInputAttributes', 'maxVertexInputBindings'):
                  if not re.search(r'\.'+name+r'\s*=\s*MAX_VBS\s*,', dev_src):
                      raise RuntimeError(f'Physical-device limit {name} does not follow MAX_VBS')
              # Both common and arch-specific headers may define MAX_VBS; update all
              # PanVK headers, never other drivers such as RADV/Turnip.
              touched=[]
              seen=0
              for header in sorted(path.rglob('*.h')):
                  src=header.read_text()
                  edited,count=patch_text(src)
                  if count:
                      seen+=1
                      touched.append(header)
                      if edited!=src: header.write_text(edited)
                      print('SN512A V11 vertex=32:',header.relative_to(root))
              if not seen or not (path/'panvk_cmd_draw.h') in touched:
                  raise RuntimeError('PanVK common MAX_VBS definition absent; stopped')
              if any(re.search(r'^\s*#\s*define\s+MAX_VBS\s+16\b',p.read_text(),re.M) for p in touched):
                  raise RuntimeError('Incomplete MAX_VBS replacement')
              print('SN512A V11: PanVK will advertise maxVertexInputAttributes=32 and maxVertexInputBindings=32.')
              print('CAUTION: device must be tested; this does not fix Android native-buffer import.')
              return touched
          
          if __name__ == '__main__':
              parser=argparse.ArgumentParser()
              parser.add_argument('mesa_root',type=Path)
              args=parser.parse_args()
              patch_mesa(args.mesa_root)
          SN512A_V11_VERTEX32_EOF
          cat > 'sn512a-src/tests/test_vertex32_patcher.py' <<'SN512A_V11_VERTEX32_EOF'
