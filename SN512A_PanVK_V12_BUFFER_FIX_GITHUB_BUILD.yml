          from patch_vertex32 import patch_text,patch_mesa
          
          assert patch_text('#define MAX_VBS 16\n')[0] == '#define MAX_VBS 32\n'
          assert patch_text('#define MAX_VBS 32\n')[0] == '#define MAX_VBS 32\n'
          assert patch_text('// no constant\n') == ('// no constant\n',0)
