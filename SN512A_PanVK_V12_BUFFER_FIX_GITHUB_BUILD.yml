          VkResult vk_common_GetSwapchainGrallocUsage2ANDROID(VkDevice d,VkFormat f,VkImageUsageFlags u,int x,uint64_t *c,uint64_t *p) {
            int usage; return setup_gralloc0_usage(f,u,&usage);
          }
          '''
