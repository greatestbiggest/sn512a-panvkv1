          cat > 'sn512a-src/patches/patch_legacy_gralloc_usage_v12.py' <<'SN512A_V12_USAGE_PATCH_EOF'
          #!/usr/bin/env python3
          """V12: request CPU-mappable Android swapchain buffers from BOTH usage ABIs.
          
          V10 patched only GetSwapchainGrallocUsage2ANDROID. The SN512A log from
          2026-11-05 shows the resulting ANativeWindow buffer AHB usage 0xb00,
          not CPU read/write usage, and the V10 probe correctly refuses it.
          
          Some Android vulkan loaders call GetSwapchainGrallocUsageANDROID (legacy).
          This patch operates in setup_gralloc0_usage(), which is called by both APIs,
          but V10's usage2 implementation only forwards HW flags; it separately ORs
          GRALLOC1 CPU flags. Hence when the legacy API is invoked, Android's gralloc
          gets SW_READ_OFTEN | SW_WRITE_OFTEN and may allocate LINEAR buffers.
          
          The existing V10 9-cookie checked layout probe, *not* this patch, verifies
          actual linear memory before Vulkan imports an ANB. No guessed modifiers.
          This can still fail on restricted vendor mapper implementations or if
          Android ignores/refuses CPU usage. The patch explicitly does not claim success.
          """
          from __future__ import annotations
          import argparse
          from pathlib import Path
          import re
          
          MARKER = '[SN512A-V12-GRALLOC0]'
          
          BLOCK = '''   /* SN512A V12: Android's legacy GetSwapchainGrallocUsageANDROID path was
              * not covered by V10's GrallocUsage2-only patch. Request mappable
              * allocations for ordinary 32bpp RGBA/BGRA swapchain color targets.
              * Mali gralloc may choose LINEAR to satisfy CPU access. The V10
              * native-buffer cookie probe still verifies layout before importing. */
             if ((image_usage & VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT) &&
                 (format == VK_FORMAT_R8G8B8A8_UNORM ||
                  format == VK_FORMAT_B8G8R8A8_UNORM ||
                  format == VK_FORMAT_R8G8B8A8_SRGB ||
                  format == VK_FORMAT_B8G8R8A8_SRGB)) {
                gralloc_usage |= GRALLOC_USAGE_SW_READ_OFTEN |
                                 GRALLOC_USAGE_SW_WRITE_OFTEN;
                static __thread bool sn512a_v12_legacy_logged;
                if (!sn512a_v12_legacy_logged) {
                   sn512a_v12_legacy_logged = true;
                   mesa_logw("[SN512A-V12-GRALLOC0] RGBA swapchain requested CPU READ+WRITE; usage=0x%x format=%u image_usage=0x%x",
                             gralloc_usage, (unsigned)format, (unsigned)image_usage);
                }
             }
          '''
          
          
          def find_body(src: str, function: str) -> tuple[int, int, str]:
              # Limit scanning to function beginning, and require exactly one occurrence.
              pattern = re.compile(r'\b' + re.escape(function) + r'\s*\(')
              found = list(pattern.finditer(src))
              # This function is defined and may be called elsewhere; identify the definition.
              defs = []
              for m in found:
                  brace = src.find('{', m.end())
                  semicolon = src.find(';', m.end())
                  if brace < 0 or (0 <= semicolon < brace):
                      continue
                  # Ensure declaration matched normal signature (no prose string).
                  if brace - m.end() > 320:
                      continue
                  depth = 0
                  for k in range(brace, len(src)):
                      if src[k] == '{': depth += 1
                      if src[k] == '}':
                          depth -= 1
                          if depth == 0:
                              defs.append((brace, k + 1, src[brace:k+1]))
                              break
              if len(defs) != 1:
                  raise ValueError(f'Expected one {function} definition; found {len(defs)}')
              return defs[0]
          
          
          def patch(src: str) -> str:
              if MARKER in src:
                  if src.count(MARKER) != 1 or 'GRALLOC_USAGE_SW_WRITE_OFTEN' not in src:
                      raise ValueError('Inconsistent prior V12 patch')
                  return src
              # Strict prerequisites: V10 path present; no implicit fallback on source drift.
              if '[SN512A-V10-ANB]' not in src or '[SN512A-AHB-BRIDGE]' not in src:
                  raise ValueError('Patch V10 native AHB validation BEFORE V12')
              if not all(tag in src for tag in ('vk_common_GetSwapchainGrallocUsageANDROID(',
                                                'vk_common_GetSwapchainGrallocUsage2ANDROID(')):
                  raise ValueError('Both Android gralloc ABI entrypoints must exist')
              a, b, body = find_body(src, 'setup_gralloc0_usage')
              assignment = re.compile(r'^\s*\*out_gralloc_usage\s*=\s*gralloc_usage\s*;', re.M)
              if len(assignment.findall(body)) != 1:
                  raise ValueError('Legacy swapchain gralloc output assignment not uniquely found')
              if 'GRALLOC_USAGE_HW_RENDER' not in body or 'GRALLOC_USAGE_HW_TEXTURE' not in body:
                  raise ValueError('Legacy usage setup no longer matches pinned upstream contract')
              if not re.search(r'\bif\s*\(\s*!gralloc_usage\s*\)', body):
                  raise ValueError('Unexpected legacy usage validation path')
              # Insert after the zero-usage check and immediately before output assignment.
              body = assignment.sub(lambda m: '\n' + BLOCK + m.group(0), body, count=1)
              new = src[:a] + body + src[b:]
              assert new.count(MARKER) == 1
              return new
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('mesa_root', type=Path)
              parser.add_argument('--dry-run', action='store_true')
              args = parser.parse_args()
              source_path = args.mesa_root / 'src/vulkan/runtime/vk_android.c'
              src = source_path.read_text()
              edited = patch(src)
              if args.dry_run:
                  print('SN512A V12 legacy gralloc usage patch: source guards PASS')
              elif edited != src:
                  source_path.write_text(edited)
                  print('SN512A V12 legacy gralloc swapchain usage patch installed')
              else:
                  print('SN512A V12 patch already present')
          
          if __name__ == '__main__':
              main()
          SN512A_V12_USAGE_PATCH_EOF
          cat > 'sn512a-src/tests/test_legacy_gralloc_usage_v12.py' <<'SN512A_V12_USAGE_TEST_EOF'
          #!/usr/bin/env python3
          """V12 patcher offline tests with simulated Mesa signatures, not GPU tests."""
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / 'patches'))
          from patch_legacy_gralloc_usage_v12 import patch, BLOCK
          
          SOURCE = '''/* [SN512A-V10-ANB] */
          /* [SN512A-AHB-BRIDGE] */
          static VkResult setup_gralloc0_usage(VkFormat format, VkImageUsageFlags image_usage, int *out_gralloc_usage)
          {
             int gralloc_usage = 0;
             if (image_usage & VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT)
                gralloc_usage |= GRALLOC_USAGE_HW_RENDER;
