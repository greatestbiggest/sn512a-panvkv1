          assert new.count('GRALLOC_USAGE_SW_READ_OFTEN') == 1
          assert new.count('GRALLOC_USAGE_SW_WRITE_OFTEN') == 1
          assert patch(new) == new
          assert 'return setup_gralloc0_usage(f,u,v);' in new
          try: patch(SOURCE.replace('GRALLOC_USAGE_HW_RENDER;', 'GRALLOC_USAGE_GPU_MAGIC;'))
          except ValueError: pass
          else: raise AssertionError('Missing legacy hardware flags must fail closed')
          try: patch(SOURCE.replace('vk_common_GetSwapchainGrallocUsageANDROID(', 'legacy_api_removed('))
          except ValueError: pass
          else: raise AssertionError('Missing legacy ABI must fail closed')
          try: patch(SOURCE.replace('*out_gralloc_usage = gralloc_usage;', '*out_gralloc_usage = 123;'))
          except ValueError: pass
          else: raise AssertionError('Changed ABI must fail closed')
          print('V12 legacy gralloc patch: guard, idempotence, source-drift tests PASS')
          
          # Compile and execute the modified C call path on host compiler with stand-in
          # Vulkan/Android integer types, validating the exact SW usage bits produced.
          import shutil
          import subprocess
          import tempfile
          cc = shutil.which('clang') or shutil.which('gcc')
          if cc:
              head = '''#include <stdint.h>
          #include <stdbool.h>
          typedef int VkResult;
          typedef int VkDevice;
          typedef unsigned VkFormat;
          typedef unsigned VkImageUsageFlags;
          #define VK_SUCCESS 0
          #define VK_ERROR_FORMAT_NOT_SUPPORTED (-11)
          #define VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT 0x10u
          #define VK_IMAGE_USAGE_TRANSFER_SRC_BIT 0x01u
          #define GRALLOC_USAGE_HW_RENDER 0x200
          #define GRALLOC_USAGE_HW_TEXTURE 0x100
          #define GRALLOC_USAGE_SW_READ_OFTEN 0x3
          #define GRALLOC_USAGE_SW_WRITE_OFTEN 0x30
          #define VK_FORMAT_R8G8B8A8_UNORM 37u
          #define VK_FORMAT_B8G8R8A8_UNORM 44u
          #define VK_FORMAT_R8G8B8A8_SRGB 43u
          #define VK_FORMAT_B8G8R8A8_SRGB 50u
          #define mesa_logw(...) ((void)0)
          '''
              tail = '''
          int main(void) {
           int usage=0;
           if(vk_common_GetSwapchainGrallocUsageANDROID(0, 37u, 0x10u, &usage) != 0)
             return 1;
           if(usage != 0x233) return 2;
           if(vk_common_GetSwapchainGrallocUsageANDROID(0, 44u, 0x10u, &usage) != 0)
             return 3;
           if(usage != 0x233) return 4;
           if(vk_common_GetSwapchainGrallocUsageANDROID(0, 37u, 0x1u, &usage) != 0)
             return 5;
           if(usage != 0x100) return 6;
           if(vk_common_GetSwapchainGrallocUsageANDROID(0, 999u, 0x10u, &usage) != 0)
             return 7;
           if(usage != 0x200) return 8;
           return 0;
          }'''
              with tempfile.TemporaryDirectory() as tmp:
                  c = Path(tmp)/'test.c'
                  out = Path(tmp)/'test'
                  c.write_text(head + new + tail)
                  cmd = [cc, '-std=gnu11', '-Werror', '-Wno-unused-parameter',
                         str(c), '-o', str(out)]
                  compilation = subprocess.run(cmd, capture_output=True, text=True)
                  if compilation.returncode:
                      raise RuntimeError(f'V12 C compiler test failed: {compilation.stderr}')
                  subprocess.run([str(out)], check=True)
              print('V12 generated legacy C: syntax and runtime CPU-usage tests PASS')
          else:
              print('NOTE: no host C compiler, V12 C syntax runtime test not performed')
          SN512A_V12_USAGE_TEST_EOF
          chmod +x sn512a-src/scripts/build_driver.sh
          python3 sn512a-src/tests/test_legacy_gralloc_usage_v12.py
          python3 sn512a-src/tests/test_vertex32_patcher.py
          python3 -m py_compile sn512a-src/patches/*.py sn512a-src/scripts/*.py sn512a-src/tests/*.py
          python3 sn512a-src/tests/test_v10_patcher.py
          python3 sn512a-src/tests/test_c_syntax.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'sn512a-src/patches')
          from bridge_owned_ahb_gralloc import patch
          from instrument_android_routes import apply
          from probe_native_anb_v10 import patch as patch_v10
          a='''static VkResult
          vk_gralloc_to_drm_explicit_layout(struct u_gralloc_buffer_handle *in_hnd, VkImageDrmFormatModifierExplicitCreateInfoEXT *out, VkSubresourceLayout *out_layouts, int max_planes) { if (u_gralloc_get_buffer_basic_info(u_gralloc, in_hnd, &info) != 0)\n return VK_ERROR_INVALID_EXTERNAL_HANDLE; }'''
          assert callable(patch) and callable(apply) and callable(patch_v10)
          print('Patch modules import: OK; full source validation occurs before build')
          PY
          # Exercise unbraced, braced, logging and fail-closed behavior without Mesa checkout.
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'sn512a-src/patches')
          from bridge_owned_ahb_gralloc import patch
          tls = 'static __thread const struct AHardwareBuffer *vk_android_owned_ahb;'
          probe = 'static VkResult vk_android_probe_linear_ahb(); VkResult foo = vk_android_probe_linear_ahb(ahb);'
          fn = ('static VkResult\nvk_gralloc_to_drm_explicit_layout(int x) {\n'
                '  struct u_gralloc_buffer_basic_info info;\n'
                '  struct u_gralloc *u_gralloc; struct u_gralloc_buffer_handle *in_hnd;\n')
          c = 'if (u_gralloc_get_buffer_basic_info(u_gralloc, in_hnd, &info) != 0)'
          forms = [
              c+'\n     return VK_ERROR_INVALID_EXTERNAL_HANDLE;',
              c+' {\n     return VK_ERROR_INVALID_EXTERNAL_HANDLE;\n  }',
              c+' {\n     mesa_loge("gralloc failed");\n     return VK_ERROR_INVALID_EXTERNAL_HANDLE;\n  }',
          ]
          for form in forms:
              source = fn + form + '\nreturn VK_SUCCESS;\n}\n' + tls + '\n' + probe
              patched = patch(source)
              assert '[SN512A-AHB-BRIDGE]' in patched
              assert patched.count('return VK_ERROR_INVALID_EXTERNAL_HANDLE;') == 1
              assert patch(patched) == patched
              assert patched.count('vk_android_probe_linear_ahb(') >= 4
          print('SN512A v6 bridge: 3 guard variants + idempotence: PASS')
          PY
      - name: Build PanVK V12 vertex32 and legacy Android gralloc buffer fix
        shell: bash
        run: |
          set -Eeuo pipefail
          source .sn512a-venv/bin/activate
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk/28.2.13676358"
          export PANVK_JOBS=2
          bash sn512a-src/scripts/build_driver.sh "$GITHUB_WORKSPACE/sn512a-build"
