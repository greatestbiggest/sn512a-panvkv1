# V12: fix the missing *legacy* Android gralloc CPU usage request; retain V11 vertex32.
# V11 extends real PanVK MAX_VBS software storage and VkPhysicalDeviceLimits
# from 16 to 32; 64 needs a broader audit of uint32 masks, so is not advertised.
# V12 extends V10 native-buffer handling by requesting mappable swapchain allocations from the legacy Android gralloc usage ABI.
# SN512A: bypasses the failing direct jm-v9 001 patch by building the universal
# Mesa stack in upstream prepare-rc5-tree.sh order (CSF-v11 before JM-v9).
# v10: target Android native swapchain images where gralloc mapper access is
# denied. Request CPU readable/writable gralloc allocation; use pinned Mesa's
# 9-cookie AHB-vs-dma-buf proof ONLY for matching v11 native window AHBs.
# Fail closed for missing AHB, unsafe layout or non-linear/modifier mismatch.
# Experimental, untested on the Coosea SN512A; may not fix this device.
# Same pinned Mesa, NDK, apt recovery, X11 deps, compiler, CSF+JM patch order.
name: SN512A PanVK v12 - Vertex32 + Legacy Gralloc CPU Buffer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Prevent a stalled package mirror from blocking GitHub Actions indefinitely.
          # Timeouts are per connection; downloads retry before switching Ubuntu mirrors.
          APT_OPTS=(-o Acquire::Retries=2 -o Acquire::http::Timeout=35 \
                    -o Acquire::https::Timeout=35 -o Acquire::http::Pipeline-Depth=0 \
                    -o Dpkg::Use-Pty=0)
          packages=(
            git build-essential cmake ninja-build pkg-config python3-venv python3-mako
            python3-yaml python3-ply python3-packaging bison flex libzstd-dev libxml2-dev
            libdrm-dev clang llvm gettext autoconf automake libtool
            gperf llvm-18-dev libclang-18-dev libllvmspirvlib-18-dev llvm-spirv-18 libclc-18 libclc-18-dev
            spirv-tools glslang-tools libxcb1-dev libx11-dev libx11-xcb-dev libxshmfence-dev libxcb-dri3-dev
            libxcb-present-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-randr0-dev
          )
          sudo apt-get "${APT_OPTS[@]}" update
          if ! sudo -E apt-get "${APT_OPTS[@]}" install -y "${packages[@]}"; then
            echo "APT: initial mirror failed; retrying with Ubuntu main archive"
            # Ubuntu 24.04 GitHub images may use Azure mirrors, which can intermittently stall.
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
            fi
            sudo apt-get "${APT_OPTS[@]}" update
            sudo -E apt-get "${APT_OPTS[@]}" install -y "${packages[@]}"
          fi
          # Exact native headers inspected by upstream scripts/prepare-x11-headers.sh.
          for h in /usr/include/xcb/xcb.h /usr/include/X11/Xlib-xcb.h /usr/include/X11/xshmfence.h; do
            test -f "$h" || { echo "FATAL: expected X11/XCB host header missing: $h" >&2; exit 1; }
            echo "OK host X11/XCB header: $h"
          done
          pkg-config --modversion xcb x11-xcb xshmfence
          # LLVMSPIRVLib must match the chosen LLVM 18 host toolchain.
          echo "LLVM host version: $(llvm-config-18 --version)"
          echo "SPIR-V translator: $(pkg-config --modversion LLVMSPIRVLib)"
          python3 -m venv .sn512a-venv
          source .sn512a-venv/bin/activate
          python3 -m pip install --upgrade pip 'meson>=1.5,<2' mako pyyaml packaging
      # v4 fixes Android SDK 'tools' package removal; only platform-tools needed.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install pinned Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'ndk;28.2.13676358'
      - name: Expand transparent embedded source and verify Python
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p sn512a-src/patches sn512a-src/scripts sn512a-src/tests
          cat > 'sn512a-src/patches/bridge_owned_ahb_gralloc.py' <<'SN512A_SOURCE_EOF'
          #!/usr/bin/env python3
          """Conservative, targeted bridge for Android gralloc failures in Mesa vk_android.c.
          v6 fixes v5's false assumption that the failure guard has no braces. The
          returned Vulkan error is preserved unless PanVK owns the exact AHB and its
          existing checked linear-layout probe verifies the imported allocation.
          This cannot fix unowned native-window buffers or unsupported Mali pipelines.
          """
          from pathlib import Path
          import argparse
          import re
          MARKER = '[SN512A-AHB-BRIDGE]'
          PROLOG = '''static struct AHardwareBuffer *
          panvk_sn512a_owned_ahb_for_gralloc(void);
          static VkResult
          vk_android_probe_linear_ahb(struct AHardwareBuffer *ahb,
                                      const AHardwareBuffer_Desc *d,
                                      const native_handle_t *h,
                                      VkImageDrmFormatModifierExplicitCreateInfoEXT *out,
                                      VkSubresourceLayout *out_layouts, int max_planes);
          '''
          GETTER = '''static struct AHardwareBuffer *
          panvk_sn512a_owned_ahb_for_gralloc(void)
          {
             return (struct AHardwareBuffer *)vk_android_owned_ahb;
          }
          '''
          # Replaces ONLY the return from the u_gralloc error branch, not the success
          # path. A compound statement is valid in both braced and unbraced if branches.
          FALLBACK = '''{
             struct AHardwareBuffer *owned = panvk_sn512a_owned_ahb_for_gralloc();
             if (owned && in_hnd->handle == AHardwareBuffer_getNativeHandle(owned)) {
                AHardwareBuffer_Desc desc;
                AHardwareBuffer_describe(owned, &desc);
                mesa_logw("[SN512A-AHB-BRIDGE] gralloc failed for same driver-owned AHB; testing verified linear layout: %ux%u fmt=%u stride=%u usage=0x%llx",
                          desc.width, desc.height, desc.format, desc.stride,
                          (unsigned long long)desc.usage);
                return vk_android_probe_linear_ahb(owned, &desc, in_hnd->handle,
                                                   out, out_layouts, max_planes);
             }
             static __thread bool sn512a_warned_not_owned;
             if (!sn512a_warned_not_owned) {
                sn512a_warned_not_owned = true;
                mesa_logw("[SN512A-AHB-BRIDGE] gralloc failed for unowned or unmatched native window buffer (fmt=%u stride=%u); refusing layout guess",
                          in_hnd->hal_format, in_hnd->pixel_stride);
             }
             return VK_ERROR_INVALID_EXTERNAL_HANDLE;
          }'''
          def skipws(s, index):
              while index < len(s) and s[index].isspace():
                  index += 1
              return index
          def balanced_end(s, start, op='(', cl=')'):
              """Return the position immediately after a balanced parentheses/braces group."""
              assert s[start] == op
              nesting = 0
              i = start
              quote = None
              while i < len(s):
                  c = s[i]
                  if quote:
                      if c == '\\':
                          i += 2
                          continue
                      if c == quote:
                          quote = None
                  elif c in '\"\'':
                      quote = c
                  elif c == op:
                      nesting += 1
                  elif c == cl:
                      nesting -= 1
                      if nesting == 0:
                          return i+1
                  i += 1
              raise ValueError('Unbalanced conditional or guard block in pinned Mesa')
          def patch(source):
              if MARKER in source:
                  # The marker is only put in our own fallback; refuse a suspicious preexisting one.
                  if 'panvk_sn512a_owned_ahb_for_gralloc' not in source:
                      raise ValueError('Found bridge marker without bridge getter; inconsistent source')
                  return source
              decl = 'static __thread const struct AHardwareBuffer *vk_android_owned_ahb;'
              fn = 'static VkResult\nvk_gralloc_to_drm_explicit_layout('
              if source.count(fn) != 1 or source.count(decl) != 1:
                  raise ValueError('Expected one original Mesa layout function and one owned-AHB TLS declaration')
              if source.count('vk_android_probe_linear_ahb(') < 2:
                  raise ValueError('Upstream validated AHB probe (android/014) missing; unsafe to bridge')
              begin = source.index(fn)
              search_region = source[begin:begin + 3000]
              guards = list(re.finditer(r'\bif\s*\(\s*u_gralloc_get_buffer_basic_info\s*\(', search_region))
              if len(guards) != 1:
                  raise ValueError(f'Expected one u_gralloc failure test in vk_gralloc layout (found {len(guards)})')
              cond_start = begin + guards[0].start()
              open_paren = source.index('(', cond_start)
              cond_end = balanced_end(source, open_paren)
              condition = source[open_paren:cond_end]
              if not re.search(r'!=\s*0', condition):
                  raise ValueError('Unexpected gralloc condition; refusing source modification')
              statement_start = skipws(source, cond_end)
              if source[statement_start] == '{':
                  statement_end = balanced_end(source, statement_start, '{', '}')
              else:
                  statement_end = source.find(';', statement_start) + 1
                  if statement_end == 0:
                      raise ValueError('Unterminated non-braced gralloc error statement')
              statement = source[statement_start:statement_end]
              target = re.compile(r'\breturn\s+VK_ERROR_INVALID_EXTERNAL_HANDLE\s*;')
              if len(target.findall(statement)) != 1:
                  raise ValueError(f'Error branch did not contain exactly one matching return: {statement[:250]!r}')
              # A single, bracketed body is valid for `if` statements lacking braces.
              repaired = target.sub(lambda _: FALLBACK, statement, count=1)
              result = source[:statement_start] + repaired + source[statement_end:]
              result = result.replace(fn, PROLOG + fn, 1)
              result = result.replace(decl, decl + '\n\n' + GETTER, 1)
              if MARKER not in result or result.count('panvk_sn512a_owned_ahb_for_gralloc(') != 3:
                  raise AssertionError('Bridge injection sanity check failed')
              return result
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('mesa_root', type=Path)
              parser.add_argument('--dry-run', action='store_true')
              args = parser.parse_args()
              f = args.mesa_root / 'src/vulkan/runtime/vk_android.c'
              if not f.is_file():
                  parser.error(f'Missing Mesa Android Vulkan runtime source at {f}')
              original = f.read_text()
              try:
                  changed = patch(original)
              except ValueError as exc:
                  print('SN512A SOURCE-DRIFT:', exc)
                  # Output enough source to correct this without another blind guess.
                  key = original.find('vk_gralloc_to_drm_explicit_layout(')
                  print('Relevant upstream vk_android.c snippet:')
                  print(original[max(0,key-70):key+1100])
                  raise
              if changed == original:
                  print('Bridge already present')
              elif args.dry_run:
                  print('Bridge passes guard discovery and owned-AHB proof preconditions; dry run')
              else:
                  f.write_text(changed)
                  print('SN512A-BRIDGE-INSTALLED:', f)
                  print('Only owned matching AHBs receive upstream 9-cookie linear layout proof.')
          if __name__ == '__main__':
              main()
          SN512A_SOURCE_EOF
          cat > 'sn512a-src/patches/instrument_android_routes.py' <<'SN512A_SOURCE_EOF'
          #!/usr/bin/env python3
          """Add one-time per-thread path logs to patched Mesa vk_android.c.
          
          The user's error log references Android vkCreateImage native buffers, not
          necessarily the driver-owned AHB that the upstream CPU probe requires.
          Do not weaken buffer validation: this patch only adds logs.
          """
          from pathlib import Path
          import argparse
          MARKER = '[SN512A-ROUTE]'
          
          NATIVE = """   static __thread bool sn512a_native_seen;
             if (!sn512a_native_seen) {
                sn512a_native_seen = true;
                mesa_logw("[SN512A-ROUTE] vk_android_get_anb_layout used: native window gralloc import; AHB ownership probe may be inapplicable");
             }
             return vk_gralloc_to_drm_explicit_layout(&gr_handle, out,"""
          
          # No risk to window framebuffers: both are only diagnostic statements.
          AHB = """   static __thread bool sn512a_ahb_seen;
             if (!sn512a_ahb_seen) {
                sn512a_ahb_seen = true;
                mesa_logw("[SN512A-ROUTE] vk_android_get_ahb_layout used: explicit AHardwareBuffer import");
             }
             VkResult result = vk_gralloc_to_drm_explicit_layout(&gr_handle, out,"""
          
          def apply(src):
              if MARKER in src:
                  return src
              # Strict, version-pinned known-Mesa anchors. Fail before modifying anything.
              n = 'return vk_gralloc_to_drm_explicit_layout(&gr_handle, out,'
              a = 'VkResult result = vk_gralloc_to_drm_explicit_layout(&gr_handle, out,'
              if src.count(n) != 1 or src.count(a) != 1:
                  raise ValueError('Unexpected vk_android.c source layout; do not patch')
              return src.replace(n, NATIVE, 1).replace(a, AHB, 1)
          
          def main():
              ap=argparse.ArgumentParser(description=__doc__)
              ap.add_argument('mesa_root',type=Path)
              ap.add_argument('--dry-run',action='store_true')
              args=ap.parse_args()
              f=args.mesa_root/'src/vulkan/runtime/vk_android.c'
              if not f.is_file(): ap.error('Missing source: '+str(f))
              before=f.read_text(); after=apply(before)
              if before==after: print('Already instrumented')
              elif args.dry_run: print('Route instrumentation anchors validated')
              else: f.write_text(after); print('Instrumented two Mesa Android import routes:',f)
          if __name__=='__main__': main()
          SN512A_SOURCE_EOF
          cat > 'sn512a-src/patches/probe_native_anb_v10.py' <<'SN512A_SOURCE_EOF'
          #!/usr/bin/env python3
          """SN512A V10 experimental native-window AHB proof on stock Android 15.
          
          V9 could only prove *driver-allocated* AHB layouts. Liberty's Android WSI
          supplies ANativeWindow/ANB handles which do not hit that branch. V10 requests
          CPU-readable/writable swapchain allocations and tries the existing upstream
          9-cookie, DMA-BUF-vs-AHardwareBuffer verified LINEAR probe, but ONLY if Android
          passes an AHB for the *exact same* native handle and reports matching geometry.
          
          The generated C temporarily advertises the imported AHB to Mesa's proof routine
          for its duration. This DOES write test cookies to the window buffer. It is
          limited to native swapchain images being created with CPU access enabled.
          It is not a general bypass of gralloc and does not fabricate DRM metadata.
          
          Not compile or hardware verified. Fail closed on source drift.
          """
          from pathlib import Path
          import argparse
          import re
          
          MARKER = '[SN512A-V10-ANB]'
          
          # This is in the block for VK_ANDROID_native_buffer, where v11's .ahb field is
          # defined. Only the CPU-readable/writable, exact-match path can run the probe.
          FALLBACK = r'''VkResult sn512a_v10_result =
                vk_gralloc_to_drm_explicit_layout(&gr_handle, out, out_layouts, max_planes);
             if (sn512a_v10_result != VK_ERROR_INVALID_EXTERNAL_HANDLE)
                return sn512a_v10_result;
          #if VK_ANDROID_NATIVE_BUFFER_SPEC_VERSION >= 11
             static __thread bool sn512a_v10_logged;
             const struct AHardwareBuffer *sn512a_v10_ahb = native_buffer->ahb;
             if (!sn512a_v10_ahb) {
                if (!sn512a_v10_logged) {
                   sn512a_v10_logged = true;
                   mesa_logw("[SN512A-V10-ANB] native buffer has no AHB pointer; cannot verify layout");
                }
                return sn512a_v10_result;
             }
             /* Check pointer identity BEFORE using any descriptor from the AHB. */
             if (AHardwareBuffer_getNativeHandle(sn512a_v10_ahb) != native_buffer->handle) {
                if (!sn512a_v10_logged) {
                   sn512a_v10_logged = true;
                   mesa_logw("[SN512A-V10-ANB] ANB/AHB native handles differ; refusing layout guess");
                }
                return sn512a_v10_result;
             }
             AHardwareBuffer_Desc sn512a_v10_desc;
             AHardwareBuffer_describe(sn512a_v10_ahb, &sn512a_v10_desc);
             /* Vulkan swapchain contents are undefined during image creation. We must
              * also explicitly request *both* CPU permissions from gralloc before
              * cookie-writing the buffer; compressed and unsupported buffers fail.
              * Restrict this experiment to single-plane 32bpp UNORM RGBA/RGBX. */
             const uint64_t sn512a_v10_cpu_read = AHARDWAREBUFFER_USAGE_CPU_READ_MASK;
             const uint64_t sn512a_v10_cpu_write = AHARDWAREBUFFER_USAGE_CPU_WRITE_MASK;
             bool sn512a_v10_supported =
                pCreateInfo->initialLayout == VK_IMAGE_LAYOUT_UNDEFINED &&
                (pCreateInfo->usage & VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT) != 0 &&
                sn512a_v10_desc.layers == 1 &&
                sn512a_v10_desc.width == pCreateInfo->extent.width &&
                sn512a_v10_desc.height == pCreateInfo->extent.height &&
                sn512a_v10_desc.stride >= sn512a_v10_desc.width &&
                sn512a_v10_desc.stride == (uint32_t)native_buffer->stride &&
                sn512a_v10_desc.format == (uint32_t)native_buffer->format &&
                (sn512a_v10_desc.format == AHARDWAREBUFFER_FORMAT_R8G8B8A8_UNORM ||
                 sn512a_v10_desc.format == AHARDWAREBUFFER_FORMAT_R8G8B8X8_UNORM) &&
                (sn512a_v10_desc.usage & sn512a_v10_cpu_read) != 0 &&
                (sn512a_v10_desc.usage & sn512a_v10_cpu_write) != 0;
             if (!sn512a_v10_supported) {
                if (!sn512a_v10_logged) {
                   sn512a_v10_logged = true;
                   mesa_logw("[SN512A-V10-ANB] AHB descriptor unsupported %ux%u fmt=%u stride=%u usage=0x%llx; refusing layout guess",
                             sn512a_v10_desc.width, sn512a_v10_desc.height,
                             sn512a_v10_desc.format, sn512a_v10_desc.stride,
                             (unsigned long long)sn512a_v10_desc.usage);
                }
                return sn512a_v10_result;
             }
             /* Preserve upstream ownership TLS around this *scoped* validation. The
              * physical owner remains Android; only image creation may touch this AHB. */
             const struct AHardwareBuffer *sn512a_v10_prev =
                panvk_sn512a_owned_ahb_for_gralloc();
             vk_android_set_owned_ahb(sn512a_v10_ahb);
             sn512a_v10_result = vk_android_probe_linear_ahb(
                (struct AHardwareBuffer *)sn512a_v10_ahb, &sn512a_v10_desc,
                native_buffer->handle, out, out_layouts, max_planes);
             vk_android_set_owned_ahb(sn512a_v10_prev);
             if (!sn512a_v10_logged) {
                sn512a_v10_logged = true;
                mesa_logw("[SN512A-V10-ANB] verified native-window linear probe result=%d",
                          sn512a_v10_result);
             }
          #endif
             return sn512a_v10_result;'''
          
          # The v2 getter declaration sits earlier in vk_android.c; the predicate also
          # ensures we cannot silently compile a second, unrelated probe.
          USAGE_ADDITION = r'''   /* SN512A V10: request CPU-readable + writable (rarely) gralloc buffers.
              * If the platform cannot honor this, the AHB proof fails closed. */
             *grallocConsumerUsage |= GRALLOC1_CONSUMER_USAGE_CPU_READ;
             *grallocProducerUsage |= GRALLOC1_PRODUCER_USAGE_CPU_WRITE;
             mesa_logi("[SN512A-V10-ANB] requested CPU-accessible Android swapchain usage");
          '''
          
          
          def get_function(source: str, signature: str) -> tuple[int, int, str]:
              match = re.search(signature, source)
              if not match:
                  raise ValueError(f'Missing source signature {signature!r}')
              opening = source.find('{', match.end())
              if opening < 0 or opening > match.end() + 500:
                  raise ValueError('Malformed C function')
              level = 0
              for i in range(opening, len(source)):
                  if source[i] == '{':
                      level += 1
                  elif source[i] == '}':
                      level -= 1
                      if level == 0:
                          return match.start(), i + 1, source[match.start():i+1]
              raise ValueError('Unbalanced C braces')
          
          
          def patch(source: str) -> str:
              if MARKER in source:
                  if (source.count('[SN512A-V10-ANB] native buffer') != 1 or
                          'GRALLOC1_CONSUMER_USAGE_CPU_READ' not in source):
                      raise ValueError('Partial V10 patch')
                  return source
              if '[SN512A-AHB-BRIDGE]' not in source:
                  raise ValueError('Requires V9 bridge patch first')
              if '[SN512A-ROUTE]' not in source:
                  raise ValueError('Requires V9 native-path instrumentation first')
              if not all(s in source for s in (
                  'vk_android_probe_linear_ahb(',
                  'panvk_sn512a_owned_ahb_for_gralloc()',
                  'vk_android_set_owned_ahb(',
              )):
                  raise ValueError('Source missing pinned Mesa AHB proof prerequisites')
          
              a, b, fn = get_function(source, r'\bvk_android_get_anb_layout\s*\(')
              # This function's call must be its final return. Never patch the AHB path.
              target = re.compile(r'\breturn\s+vk_gralloc_to_drm_explicit_layout\s*\(\s*&gr_handle\s*,\s*out\s*,\s*out_layouts\s*,\s*max_planes\s*\)\s*;')
              if len(target.findall(fn)) != 1:
                  raise ValueError('Cannot find exactly one native-buffer layout return')
              result = source[:a] + target.sub(lambda _: FALLBACK, fn, count=1) + source[b:]
          
              a, b, fn = get_function(result, r'\bvk_common_GetSwapchainGrallocUsage2ANDROID\s*\(')
              return_anchor = re.compile(r'\breturn\s+VK_SUCCESS\s*;')
              matches = list(return_anchor.finditer(fn))
              if len(matches) != 1 or 'GRALLOC1_PRODUCER_USAGE_GPU_RENDER_TARGET' not in fn:
                  raise ValueError('Unexpected gralloc-usage function layout')
              # Replace final return, not setup failures.
              new_fn = fn[:matches[0].start()] + USAGE_ADDITION + fn[matches[0].start():]
              result = result[:a] + new_fn + result[b:]
              if result.count('[SN512A-V10-ANB]') != 5:
                  raise AssertionError('Expected five V10 diagnostic message tags')
              return result
          
          
          def main():
              ap = argparse.ArgumentParser(description=__doc__)
              ap.add_argument('mesa_root', type=Path)
              ap.add_argument('--dry-run', action='store_true')
              args = ap.parse_args()
              file = args.mesa_root / 'src/vulkan/runtime/vk_android.c'
              before = file.read_text()
              after = patch(before)
              if args.dry_run:
                  print('SN512A V10 source guards OK')
              elif before == after:
                  print('SN512A V10 already patched')
              else:
                  file.write_text(after)
                  print('SN512A V10 applied:', file)
          
          
          if __name__ == '__main__':
              main()
          SN512A_SOURCE_EOF
          cat > 'sn512a-src/tests/test_v10_patcher.py' <<'SN512A_SOURCE_EOF'
          #!/usr/bin/env python3
          """Source-to-source guard checks; NOT hardware or cross-compile tests."""
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / 'patches'))
          from probe_native_anb_v10 import patch
          
          SRC = r'''#include "vk_android.h"
          /* [SN512A-AHB-BRIDGE] */
          /* [SN512A-ROUTE] */
          static void panvk_sn512a_owned_ahb_for_gralloc();
          static void vk_android_probe_linear_ahb();
          void vk_android_set_owned_ahb();
          VkResult vk_android_get_anb_layout(
             const VkImageCreateInfo *pCreateInfo,
             VkImageDrmFormatModifierExplicitCreateInfoEXT *out,
             VkSubresourceLayout *out_layouts, int max_planes)
          {
             const VkNativeBufferANDROID *native_buffer = pCreateInfo->pNext;
             struct u_gralloc_buffer_handle gr_handle = {
                .handle = native_buffer->handle,
                .hal_format = native_buffer->format,
                .pixel_stride = native_buffer->stride,
             };
             return vk_gralloc_to_drm_explicit_layout(&gr_handle, out,
                                                       out_layouts, max_planes);
          }
          VkResult vk_common_GetSwapchainGrallocUsage2ANDROID(VkDevice device,
             VkFormat format, VkImageUsageFlags imageUsage,
             VkSwapchainImageUsageFlagsANDROID swapchainImageUsage,
             uint64_t *grallocConsumerUsage, uint64_t *grallocProducerUsage)
          {
             *grallocConsumerUsage = *grallocProducerUsage = 0;
             if (gralloc_usage & GRALLOC_USAGE_HW_RENDER)
